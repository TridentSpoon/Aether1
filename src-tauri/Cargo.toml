[package]
name = "aether1"
version = "0.1.0"
description = "AETHER1 - Cybernetic AI Companion"
authors = ["TridentSpoon"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
