[package]
name = "aether1"
version = "0.4.0"
description = "AETHER1 - Cybernetic AI Companion"
authors = ["TridentSpoon"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# "bundled" compiles SQLite from source instead of linking a system library --
# needed for this to build on Windows without extra setup.
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.32"
# Battery info was dropped from sysinfo itself a few releases back; this is its
# successor for that one piece (cross-platform: sysfs on Linux, SetupAPI on Windows).
starship-battery = "0.11.1"
which = "8"
msedge-tts = { version = "0.4.0", default-features = false, features = ["blocking", "rustls"] }
regex = "1.13.1"
rustls = { version = "0.23.43", features = ["ring"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "fs", "time", "sync"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# Step 13: the crash watcher needs a way to say something while the HUD is closed, which
# is the only reason this is here -- nothing else in AETHER1 notifies.
tauri-plugin-notification = "2"
# Already in the tree via tauri; taken as a direct dependency so local_only.rs can decide
# whether a configured endpoint is on this machine or the local network by parsing its
# host properly, rather than by string-matching a URL.
url = "2"
mdns-sd = "0.21.3"
bip39 = { version = "2.2.2", features = ["rand"] }
sha2 = "0.11.0"
portable-pty = "0.9.0"
base64 = "0.22"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
getrandom = "0.3"
minisign-verify = "0.3"
keyring = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# Debug symbols are about two megabytes of the shipped binary and are of no use to anyone
# running it -- a backtrace from a release build is read from the source, not from these.
strip = true
