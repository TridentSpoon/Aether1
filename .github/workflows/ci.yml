# Every pull request gets the same checks a careful contributor would run before pushing:
# the code compiles on a clean machine, the tests pass, clippy is quiet and the formatting
# is what rustfmt produces.
#
# The point is the *clean machine*. Everything here can be run locally, and should be --
# but a working copy accumulates build artifacts, installed libraries and half-finished
# edits, so "it passes here" and "it passes anywhere" are different claims. This makes the
# second one.

name: CI

# A change to nothing but prose cannot fail any check in this file, and a workflow that
# never starts costs nothing -- so those are filtered out here, before a runner is handed
# out. Everything else is decided inside the jobs below, because "did this change matter"
# has a different answer for the Rust checks than for the frontend ones.
#
# This only skips a run when *every* changed file matches. A commit touching README.md and
# src-tauri/ together still runs in full. The list is spelled out twice because GitHub's
# workflow parser does not support YAML anchors.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

# A second push to the same branch makes the first run's answer worthless, so it is
# cancelled rather than left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust -- build, test, clippy, format
    runs-on: ubuntu-latest
    # A normal run of this job is about five and a half minutes. Twice it has hung for
    # hours instead -- not compiling, just stopped, waiting on a GitHub service that never
    # answered. Without a limit the default is six hours, so a hung run holds a pull request
    # open for most of a day and looks exactly like a slow one. This turns that into a
    # failure you can see and re-run inside half an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The filter below diffs this change against its base, which needs more history
          # than the single commit a default checkout fetches. It also makes build.rs's
          # `git log -60` able to find a merge subject, which it cannot in a depth-1 clone.
          fetch-depth: 0

      # Around a third of the changes that land here touch nothing under src-tauri/ -- and
      # no Rust check can notice that. Nothing under src-tauri/ reads a frontend file at build or test
      # time (server.rs serves that directory at *runtime*, and there is no src-tauri/tests),
      # so `cargo fmt`, `cargo clippy` and `cargo test` return exactly what they returned on
      # the previous commit while taking five and a half minutes to say so.
      #
      # The cross-cutting checks -- the ones that compare frontend/ against src-tauri/, like
      # check_panel_fields.sh -- all live in the `frontend` job, which is why that job has no
      # filter and always runs. This one is the expensive half, and the only one worth
      # skipping.
      #
      # Done as an early exit inside the job rather than an `if:` on the job itself, for two
      # reasons: GitHub bills every job it starts as a whole minute, so a separate filter job
      # would hand back a minute of the saving on every single run; and a job whose steps all
      # skip still reports success, where a skipped job reports "skipped" and would look like
      # a check that never ran.
      - name: Work out whether anything Rust changed
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # A base that cannot be resolved means the question cannot be answered, so
          # everything runs. That covers a brand-new branch (github.event.before is all
          # zeroes), a force-push that orphaned the previous tip, and a re-run after the
          # history it referred to moved.
          if [ -z "${BASE:-}" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit to compare against -- running the Rust checks."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots, so this is measured from where the branch left the base rather than
          # against the base's current tip -- otherwise commits landing on main meanwhile
          # get counted as part of this change.
          changed=$(git diff --name-only "${BASE}...HEAD")

          if [ -z "$changed" ]; then
            echo "Nothing changed against ${BASE} -- running the Rust checks."
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed against ${BASE}:"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # src-tauri/ is the whole crate: sources, Cargo.toml, Cargo.lock, build.rs,
          # tauri.conf.json, capabilities. ci.yml counts too -- it is hashed into the apt
          # cache key below, and a change to these steps has to be exercised by them.
          # A here-string rather than `printf | grep -q`: grep -q exits the moment it
          # matches, which can leave printf killed by SIGPIPE, and under `pipefail` that
          # makes the pipeline fail *because* the pattern was found.
          if grep -qE '^(src-tauri/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "Rust-relevant files changed -- running the Rust checks."
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing under src-tauri/ changed -- skipping the Rust checks."
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      # Every step from here down carries the same condition, so that a change which cannot
      # affect them ends the job in about twenty seconds instead of five and a half minutes.

      # Aether1 links against the system webview and GTK stack on Linux; without these
      # the build fails at link time with an error that names a .pc file rather than a
      # package. This list matches the Debian/Ubuntu row in the README's build table.
      #
      # The .deb files are cached between runs. apt normally deletes them once they are
      # installed, so it is told to keep them and they are copied to somewhere the cache
      # action can actually reach: /var/cache/apt/archives is root-owned, and restoring
      # into it fails on permissions. The key covers this file, so editing the package list
      # gets a fresh cache rather than a stale one missing whatever was added.
      - name: Cache the apt downloads
        if: steps.filter.outputs.rust == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/aether1-apt
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install the Linux build dependencies
        if: steps.filter.outputs.rust == 'true'
        run: |
          set -euo pipefail
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          mkdir -p ~/.cache/aether1-apt
          # Anything kept from a previous run goes back where apt looks first, so these are
          # installed from disk rather than downloaded again.
          sudo cp -n ~/.cache/aether1-apt/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libnotify-bin bubblewrap
          # Keep them for next time. cp of a root-owned file lands root-owned, and the cache
          # action runs as the runner user, so it has to be able to read them back.
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/aether1-apt/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/aether1-apt

      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.rust == 'true'
        with:
          components: clippy, rustfmt

      # Keyed on the lockfile so a dependency change gets a fresh cache and everything
      # else reuses one -- the compile is by far the longest step here.
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.rust == 'true'
        with:
          workspaces: src-tauri

      - name: Format
        if: steps.filter.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo fmt --check

      # --all-targets so the tests are linted too: a warning in a test is still a warning,
      # and test code is where sloppiness hides.
      - name: Clippy
        if: steps.filter.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # A few sandbox tests execute the ordinary app binary inside bubblewrap. Clippy
      # builds its own lint target, not target/debug/aether1, so materialize the binary
      # before the test harness reaches those checks.
      - name: Build the application binary
        if: steps.filter.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo build

      - name: Tests
        if: steps.filter.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo test

  # Deliberately unfiltered, unlike the Rust job above. Several of these checks read
  # src-tauri/ as well as frontend/ -- check_panel_fields.sh compares the panel's fields
  # against llm/mod.rs, and check_terminal_isolation.sh reads only Rust files -- so a
  # Rust-only change is exactly when some of them matter most. It runs in about fifteen
  # seconds, which is inside the one minute GitHub bills as a minimum anyway, so there is
  # nothing to save here even when it has no work to do.
  frontend:
    name: Frontend -- syntax
    runs-on: ubuntu-latest
    # This job runs in about fifteen seconds. Anything approaching ten minutes is stuck, not
    # slow, and should say so rather than sitting there.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The HUD's JavaScript is plain files loaded by <script> tags -- no bundler, no
      # compiler, nothing that would notice a syntax error before the page goes blank in
      # front of someone. This is the cheapest possible guard against that, and it covers
      # avatar files, which are exactly the code most likely to arrive half-written.
      - name: Check every script parses
        run: |
          status=0
          while IFS= read -r file; do
            if ! node --check "$file"; then
              echo "::error file=$file::this file does not parse"
              status=1
            fi
          done < <(find frontend -name '*.js' -not -path 'frontend/vendor/*')
          exit $status

      # The vendored stylesheet is a static build: it only contains the utility classes
      # that were in the HTML when it last ran. Markup merged afterwards renders unstyled,
      # silently, and the only way to notice is to look. Rebuilding it here and comparing
      # turns that into a failed check with an instruction attached.
      - name: Check the vendored stylesheet is up to date
        run: |
          ./scripts/build_vendor_css.sh
          if ! git diff --quiet -- frontend/vendor/tailwind.css; then
            echo "::error::frontend/vendor/tailwind.css is out of date."
            echo "::error::Run ./scripts/build_vendor_css.sh and commit the result."
            git diff --stat -- frontend/vendor/tailwind.css
            exit 1
          fi

      # The three.js bundle contains only the parts the frontend asked for when it was
      # built. A new THREE.Something added since is not a missing feature -- it is an
      # avatar that throws the moment somebody picks it. Checked rather than rebuilt:
      # the bundle is byte-identical only on the same esbuild version, so comparing it
      # the way the stylesheet is compared would fail on an unrelated toolchain bump.
      - name: Check the vendored three.js covers what the frontend uses
        run: ./scripts/check_vendor_three.sh

      # Avatar files are fetched by name when somebody picks one, so an avatar missing from
      # the loader's list is not a broken build -- it is a button that does nothing, which
      # nobody notices until they press it.
      - name: Check every avatar file is reachable
        run: ./scripts/check_avatar_loader.sh

      # `hidden` on an element that a component stylesheet also gives a display to is a
      # silent no-op -- the element stays on screen and only a person looking at it notices.
      - name: Check the responsive hidden utilities still work
        run: ./scripts/check_hidden_utilities.sh

      # Tailwind's text colours are hard-coded for a dark ground. One that is never remapped
      # to a theme variable is unreadable on the light theme and perfectly fine on the dark
      # one the work was done in, so nobody sees it.
      - name: Check every text colour follows the theme
        run: ./scripts/check_theme_remap.sh

      # A panel reading a field the engine stopped sending gets `undefined`, which renders
      # as a zero rather than as an error -- a confident number derived from nothing, and
      # only visible to someone looking at the panel.
      - name: Check the performance panel only reads fields the engine sends
        run: ./scripts/check_panel_fields.sh

      # The terminal runs a real shell. It is safe to ship only because nothing but the
      # native window can reach it -- no tool, no HTTP route, nothing persisted. Every one
      # of those is the kind of property a reasonable-looking refactor removes silently, so
      # it is checked rather than remembered.
      - name: Check the terminal stays the operator's alone
        run: ./scripts/check_terminal_isolation.sh
