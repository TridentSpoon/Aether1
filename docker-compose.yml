version: '3.8'

services:
  cortana-ai:
    build: .
    container_name: aether-cortana-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/cortana_memory.db:/app/backend/cortana_memory.db
      - ./backend/audio_cache:/app/backend/audio_cache
    environment:
      - PYTHONUNBUFFERED=1
