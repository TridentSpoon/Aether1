version: '3.8'

services:
  aether1:
    build: .
    container_name: aether1-core
    restart: unless-stopped
    ports:
      - "8378:8378"
    volumes:
      - ./backend/aether1_memory.db:/app/backend/aether1_memory.db
      - ./backend/audio_cache:/app/backend/audio_cache
    environment:
      - PYTHONUNBUFFERED=1
