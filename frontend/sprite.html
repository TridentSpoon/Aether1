<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHER1 Sprite</title>
    <!-- Local copies, same as the HUD: the sprite is the always-on-top desktop window,
         so it least of all should need a working network to draw itself. -->
    <link rel="stylesheet" href="vendor/fonts.css?v=1">
    <!-- The theme, before anything is painted. These two are pure data and pure computation
         -- no DOM beyond <html>'s own attribute and custom properties -- so they belong in the
         head rather than with the engine at the foot of the body: loaded down there, the page
         renders once in the fallback palette first, which on a light theme is a dark flash. -->
    <script src="js/hologram/palettes.js?v=19"></script>
    <script src="js/theme.js?v=5"></script>
    <script>Aether1Theme.apply(document);</script>
    <script src="vendor/three.min.js?v=1"></script>
    <link rel="stylesheet" href="css/sprite.css?v=3">
</head>
<body>
    <div id="sprite-root">
        <div id="hologram-viewport"></div>

        <div id="sprite-topbar">
            <button id="sprite-btn-hud" title="Open main HUD">⧉</button>
            <button id="sprite-btn-close" title="Close sprite">✕</button>
        </div>
    </div>

    <!-- Same hologram engine as the main HUD (see index.html's own script block for the
         load-order note: core.js first, then the loader, animate.js last). -->
    <script src="js/hologram/core.js?v=42"></script>
    <script src="js/hologram/geometry-helpers.js?v=20"></script>
    <!-- Which avatar lives in which file, and fetching it the first time it is asked for.
         Every one of the nineteen avatar files used to be listed here and loaded at launch,
         about 195 KB of geometry, to put one of them on screen. See
         js/hologram/avatar-loader.js -- the list of files now lives there, once, instead of
         being repeated in this page, sprite.html and avatar-lab.html. -->
    <script src="js/hologram/avatar-loader.js?v=1"></script>
    <script src="js/hologram/animate.js?v=38"></script>
    <script src="js/sprite.js?v=7"></script>
</body>
</html>
