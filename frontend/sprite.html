<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AETHER1 Sprite</title>
    <!-- Local copies, same as the HUD: the sprite is the always-on-top desktop window,
         so it least of all should need a working network to draw itself. -->
    <link rel="stylesheet" href="vendor/fonts.css?v=1">
    <!-- The theme, before anything is painted. These two are pure data and pure computation
         -- no DOM beyond <html>'s own attribute and custom properties -- so they belong in the
         head rather than with the engine at the foot of the body: loaded down there, the page
         renders once in the fallback palette first, which on a light theme is a dark flash. -->
    <script src="js/hologram/palettes.js?v=19"></script>
    <script src="js/theme.js?v=4"></script>
    <script>Aether1Theme.apply(document);</script>
    <script src="vendor/three.min.js?v=1"></script>
    <link rel="stylesheet" href="css/sprite.css?v=2">
</head>
<body>
    <div id="sprite-root">
        <div id="hologram-viewport"></div>

        <div id="sprite-bubble" class="hidden"></div>

        <div id="sprite-chat-bar" class="hidden">
            <input id="sprite-chat-input" type="text" placeholder="Say something...">
        </div>

        <div id="sprite-topbar">
            <button id="sprite-btn-hud" title="Open main HUD">⧉</button>
            <button id="sprite-btn-close" title="Close sprite">✕</button>
        </div>
    </div>

    <!-- Same hologram engine as the main HUD (see index.html's own script block for the
         load-order note: core.js first, then the per-avatar builders, animate.js last). -->
    <script src="js/hologram/core.js?v=41"></script>
    <script src="js/hologram/geometry-helpers.js?v=20"></script>
    <script src="js/hologram/avatar-halcy.js?v=17"></script>
    <script src="js/hologram/avatar-arx-limes.js?v=17"></script>
    <script src="js/hologram/avatar-nexus.js?v=29"></script>
    <script src="js/hologram/avatar-red9000.js?v=19"></script>
    <script src="js/hologram/avatar-arx-logos.js?v=18"></script>
    <script src="js/hologram/avatar-arx-locas.js?v=2"></script>
    <script src="js/hologram/avatar-arx-legionare.js?v=1"></script>
    <script src="js/hologram/avatar-arx-loregenda.js?v=1"></script>
    <script src="js/hologram/avatar-alt.js?v=3"></script>
    <!-- The parts kit and the avatar assembled from a saved recipe (see
         frontend/avatar-lab.html) -- without these, selecting "Your own" in the HUD has
         nothing to show here: the sprite falls back to hAlcy instead of the custom design. -->
    <script src="js/hologram/parts.js?v=1"></script>
    <script src="js/hologram/avatar-custom.js?v=2"></script>
    <script src="js/hologram/avatar-a1.js?v=1"></script>
    <script src="js/hologram/avatar-senti.js?v=2"></script>
    <script src="js/hologram/avatar-white-rabbit.js?v=2"></script>
    <script src="js/hologram/animate.js?v=37"></script>
    <script src="js/voice.js?v=17"></script>
    <script src="js/sprite.js?v=6"></script>
</body>
</html>
