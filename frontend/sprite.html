<!DOCTYPE html>
<html lang="en" data-theme="halcy">
<head>
    <meta charset="UTF-8">
    <title>AETHER1 Sprite</title>
    <!-- Local copies, same as the HUD: the sprite is the always-on-top desktop window,
         so it least of all should need a working network to draw itself. -->
    <link rel="stylesheet" href="vendor/fonts.css?v=1">
    <script src="vendor/three.min.js?v=1"></script>
    <link rel="stylesheet" href="css/sprite.css?v=2">
</head>
<body>
    <div id="sprite-root">
        <div id="hologram-viewport"></div>

        <div id="sprite-bubble" class="hidden"></div>

        <div id="sprite-chat-bar" class="hidden">
            <input id="sprite-chat-input" type="text" placeholder="Say something...">
        </div>

        <div id="sprite-topbar">
            <button id="sprite-btn-hud" title="Open main HUD">⧉</button>
            <button id="sprite-btn-close" title="Close sprite">✕</button>
        </div>
    </div>

    <!-- Same hologram engine as the main HUD (see index.html's own script block for the
         load-order note: core.js first, then the per-avatar builders, animate.js last). -->
    <script src="js/hologram/palettes.js?v=17"></script>
    <script src="js/hologram/core.js?v=34"></script>
    <script src="js/hologram/geometry-helpers.js?v=19"></script>
    <script src="js/hologram/avatar-halcy.js?v=16"></script>
    <script src="js/hologram/avatar-arx-limes.js?v=16"></script>
    <script src="js/hologram/avatar-nexus.js?v=28"></script>
    <script src="js/hologram/avatar-red9000.js?v=17"></script>
    <script src="js/hologram/avatar-arx-logos.js?v=17"></script>
    <script src="js/hologram/avatar-alt.js?v=2"></script>
    <script src="js/hologram/animate.js?v=34"></script>
    <script src="js/voice.js?v=16"></script>
    <script src="js/sprite.js?v=1"></script>
</body>
</html>
